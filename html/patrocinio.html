<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorpion FSAE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../dist/output.css">
</head>

<body>

    <header>
        <nav>
            <a href="#" class="logo">
                <img src="../img/Scorpion/SCORPION FSAE LOGO FULL 1.png" alt="Scorpion FSAE">
                <span class="logo-text">Scorpion <em>FSAE</em></span>
            </a>

            <ul>
                <li><a href="#equipe">Equipe</a></li>
                <li><a href="#patrocinio">Patrocinadores</a></li>
                <li><a href="#competicao">Competição</a></li>
                <li><a href="#sobre">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <section id="equipe">
        <div class="section-header">
            <h1>Equipe</h1>
            <p class="section-subtitle">Conheça nossa equipe</p>
        </div>
    </section>

    <section id="patrocinio">
        <div class="section-header">
            <h1>Patrocinadores</h1>
            <p class="section-subtitle">Aqueles que apoiam o futuro</p>
        </div>

        <div class="logo-grid">

            <div class="patrocinador">
                <a href="https://www.simscale.com/" target="_blank" rel="noopener">
                    <img src="../img/Patrocinadores/SimScale_FundoBranco.png" alt="SimScale">
                </a>
            </div>

            <div class="patrocinador">
                <a href="https://www.3ds.com/" target="_blank" rel="noopener">
                    <img src="../img/Patrocinadores/dassault.png" alt="Dassault Systèmes">
                </a>
            </div>

            <!-- <div class="patrocinador placeholder"></div>
            <div class="patrocinador placeholder"></div>
            <div class="patrocinador placeholder"></div>
            <div class="patrocinador placeholder"></div>
            <div class="patrocinador placeholder"></div>
            <div class="patrocinador placeholder"></div> -->

        </div>
    </section>

    <section id="apoiadores">
        <div class="section-header">
            <h1 class="alt">Apoiadores</h1>
            <p class="section-subtitle">Quem acelera com a gente</p>
        </div>

        <div class="logo-grid">

            <div class="apoiador">
                <a href="https://www.instagram.com/racingtmg/" target="_blank" rel="noopener">
                    <img src="../img/Patrocinadores/tmg.png" alt="TMG">
                </a>
            </div>

            <div class="apoiador">
                <a href="https://rocatti.com.br/" target="_blank" rel="noopener">
                    <img src="../img/Patrocinadores/Rocatti.png" alt="Rocatti">
                </a>
            </div>

            <!-- <div class="apoiador placeholder"></div>
            <div class="apoiador placeholder"></div> -->

        </div>
    </section>

    <section id="competicao">
        <div class="section-header">
            <h1>Competição</h1>
            <p class="section-subtitle">Em breve</p>
        </div>
    </section>

    <section id="sobre">
        <div class="section-header">
            <h1>Sobre</h1>
            <p class="section-subtitle">Conheça mais sobre a Scorpion FSAE</p>
        </div>
    </section>

</html>
